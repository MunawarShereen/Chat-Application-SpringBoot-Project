<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #425054;
            margin-bottom: 20px;
        }

        .chat-message {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .chat-message:last-child {
            border-bottom: none;
        }

        .sender {
            font-weight: bold;
            color: #007bff;
        }

        .timestamp {
            font-size: 0.9em;
            color: #6c757d;
        }

        .content {
            margin-top: 5px;
        }

        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
  <h1>Chat History</h1>

  <!-- Back Button -->
  <div class="text-center mb-3">
    <a href="/chat" class="btn btn-secondary">Back to Chat</a>
  </div>

  <div id="history">
    <div th:each="message : ${messages}" class="chat-message">
      <div class="sender" th:text="${message.sender}">Sender Name</div>
      <div class="content" th:text="${message.content}">Message Content</div>
      <div class="timestamp" th:text="${message.formattedTimestamp}">Timestamp</div>
    </div>
  </div>
</div>
</body>
</html>
