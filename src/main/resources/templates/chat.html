<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #89A8B2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #E5E1DA;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 80vw;
        }

        h1 {
            text-align: center;
            color: #425054;
            font-size: 1.8em;
            margin-bottom: 10px;
            padding-top: 10px;
        }

        #chat {
            border: 1px solid #ddd;
            border-radius: 5px;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            background-color: #fafafa;
        }

        #chat div {
            padding: 5px;
            border-bottom: 1px solid #eee;
            margin-bottom: 5px;
            cursor: pointer;
        }

        #chat div.selected {
            background-color: #d1ecf1; /* Highlight color for selected message */
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: calc(100% - 50px);
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        .btn {
            width: 100px;
            height: 42px;
            border: none;
            background-color: #B3C8CF;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #sendMessage:hover, #deleteMessage:hover, #editMessage:hover {
            background-color: #5ac8ed;
        }

        #deleteMessage:disabled, #editMessage:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
<div class="container mt-4">
    <h1 class="text-center">Real-Time Chat Application</h1>

    <!-- History Button -->
    <div class="text-center mb-3">
        <a href="/history" class="btn btn-primary">History</a>
    </div>

    <!-- Chat Container -->
    <div id="chat" class="border rounded p-3 mb-3" style="height: 300px; overflow-y:auto;">
    </div>

    <!-- Sender Input -->
    <div class="input-group mb-3">
        <input id="senderInput" type="text" class="form-control" placeholder="Your Name..."/>
    </div>

    <!-- Message Input -->
    <div class="input-group mb-3">
        <input id="messageInput" type="text" class="form-control" placeholder="Write a message..."/>
        <div id="input-group append">
            <button id="sendMessage" class="btn btn-primary">Send</button>
            <button id="editMessage" class="btn btn-warning" disabled>Edit</button>
            <button id="deleteMessage" class="btn btn-danger" disabled>Delete</button>
        </div>
    </div>
</div>

<script>
    let stompClient;
    let selectedMessageId = null;
    let selectedMessageElement = null;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                handleMessage(JSON.parse(message.body));
            });
        });
    }

    function handleMessage(message) {
        var chat = document.getElementById('chat');

        if (message.content && message.content.startsWith("Error:")) {
            alert(message.content.replace("Error: ", ""));
            return;
        }

        if (message.id && !message.content) {
            const messageElement = document.querySelector(`#chat div[data-id='${message.id}']`);
            if (messageElement) messageElement.remove();
            return;
        }

        // Check if it's an update to an existing message
        var existingMessageElement = document.querySelector(`#chat div[data-id='${message.id}']`);

        if (existingMessageElement) {
            // If the message already exists, update its content
            existingMessageElement.textContent = message.sender + ': ' + message.content;
        } else {
            // Otherwise, create a new message element
            var messageElement = document.createElement('div');
            messageElement.setAttribute("data-id", message.id); // Store message ID
            messageElement.textContent = message.sender + ': ' + message.content;

            messageElement.onclick = function () {
                selectMessage(message.id, messageElement);
            };

            chat.appendChild(messageElement);
        }

        chat.scrollTop = chat.scrollHeight;
    }

    function selectMessage(id, element) {
        selectedMessageId = id;
        selectedMessageElement = element;

        // Highlight the selected message
        const chatMessages = document.querySelectorAll('#chat div');
        chatMessages.forEach(msg => msg.classList.remove('selected'));
        element.classList.add('selected');

        // Enable the delete and edit buttons
        document.getElementById('deleteMessage').disabled = false;
        document.getElementById('editMessage').disabled = false;

        // Do not copy message content to the input box when selecting
        // Only copy the message content when the edit button is pressed
        document.getElementById('editMessage').onclick = function () {
            document.getElementById('messageInput').value = element.textContent.split(': ')[1];
        };
    }

    function sendMessage() {
        var sender = document.getElementById('senderInput').value;
        var content = document.getElementById('messageInput').value;

        if (selectedMessageId) {
            // If a message is being edited, update it
            var updatedMessage = {
                id: selectedMessageId,
                sender: sender,
                content: content
            };
            stompClient.send("/chatApp/editMessage", {}, JSON.stringify(updatedMessage));

            // Update the local message element with new content
            selectedMessageElement.textContent = sender + ': ' + content;

            // Clear selection and input
            selectedMessageId = null;
            selectedMessageElement = null;
            document.getElementById('editMessage').disabled = true;
            document.getElementById('deleteMessage').disabled = true;
        } else {
            // Otherwise, send a new message
            var chatMessage = { sender: sender, content: content };
            stompClient.send("/chatApp/sendMessage", {}, JSON.stringify(chatMessage));
        }

        document.getElementById('messageInput').value = '';
    }

    function deleteMessage() {
        if (!selectedMessageId) return;

        var sender = document.getElementById('senderInput').value;
        var deleteRequest = {
            id: selectedMessageId,
            sender: sender
        };

        stompClient.send("/chatApp/deleteMessage", {}, JSON.stringify(deleteRequest));
    }

    window.onload = function () {
        connect();
    };

    document.getElementById('sendMessage').onclick = sendMessage;
    document.getElementById('deleteMessage').onclick = deleteMessage;
</script>
</body>
</html>
